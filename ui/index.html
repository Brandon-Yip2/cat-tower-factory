<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="factory-token" content="__FACTORY_TOKEN__">
  <title>Cat Tower Factory</title>
  <link rel="icon" href="/factory.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="side">
    <a class="brand" href="#home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6.5 12 8.5 1.5 16 9l7.5-7.5 2 10.5z" fill="#2a6f8f"/><rect x="6.5" y="8" width="19" height="23" rx="4" fill="#2a6f8f"/><path d="M9 9.5l.6-4.9 3.8 3.8zM23 9.5l-.6-4.9-3.8 3.8z" fill="#f3b7c4"/><rect x="10" y="13" width="4" height="4.5" rx="1.2" fill="#f6c34a"/><rect x="18" y="13" width="4" height="4.5" rx="1.2" fill="#f6c34a"/><path d="M13.5 31v-6a2.5 2.5 0 0 1 5 0v6z" fill="#1b465a"/></svg>
      <span>Cat Tower<br><small>Factory</small></span>
    </a>
    <button class="btn primary wide" id="newIdeaBtn" type="button">New idea</button>
    <nav aria-label="Sections">
      <a href="#home" data-nav="home">Home <span class="count attention" id="navNeeds" hidden></span></a>
      <a href="#ideas" data-nav="ideas">Ideas</a>
      <a href="#agents" data-nav="agents">Agents <span class="count" id="navWorking" hidden></span></a>
      <a href="#loops" data-nav="loops">Loops</a>
      <a href="#tools" data-nav="tools">Tools</a>
      <a href="#activity" data-nav="activity">Activity</a>
      <a href="#improvements" data-nav="improvements">Improvements</a>
    </nav>
    <div class="side-foot">
      <div class="budget" id="budget"></div>
      <label class="switch"><input type="checkbox" id="pauseToggle"><span>Pause the Factory</span></label>
      <div class="conn" id="conn">Connecting…</div>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-live="polite"></aside>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
